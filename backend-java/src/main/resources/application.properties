server.port=${PORT:3000}
spring.application.name=chivas-rumberas-backend-java

# PostgreSQL Datasource (soporta DATABASE_URL tanto en formato jdbc:postgresql:// como postgresql://)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chivas_rumberas}
spring.datasource.username=${DB_USERNAME:chivas}
spring.datasource.password=${DB_PASSWORD:chivas_secret_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Jackson JSON serialization
spring.jackson.default-property-inclusion=non_null
spring.main.banner-mode=off

# Aplicación
app.jwt.secret=${JWT_SECRET:chivas_rumberas_super_secret_jwt_key_2026_benchmark}
app.jwt.expires-in=${JWT_EXPIRES_IN:8h}
app.integrations.mode=${INTEGRATIONS_MODE:mock}
app.integrations.mock-latency-ms=${MOCK_LATENCY_MS:50}
app.rate-limit.disabled=${DISABLE_RATE_LIMIT:false}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cors.origins=${CORS_ORIGINS:*}
